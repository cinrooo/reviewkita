<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Membuka Ulasan Google...</title>
    <meta name="description" content="Anda akan diarahkan ke Google Maps untuk memberikan ulasan." />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

      :root {
        --primary: #4f46e5;
        --primary-light: #6366f1;
        --google-blue: #1a73e8;
        --google-red: #ea4335;
        --google-yellow: #fbbc04;
        --google-green: #34a853;
        --text: #0f172a;
        --muted: #64748b;
        --bg: #f8fafc;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
      }

      .wrap {
        width: 100%;
        max-width: 380px;
        text-align: center;
        animation: up 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes up {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Google G icon */
      .g-icon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 4px 24px rgba(0,0,0,0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }

      .g-icon svg {
        width: 42px;
        height: 42px;
      }

      /* Business name */
      .biz-name {
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
        line-height: 1.25;
        margin-bottom: 6px;
      }

      .biz-addr {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 32px;
      }

      /* Stars display (static, decorative) */
      .stars-row {
        display: flex;
        justify-content: center;
        gap: 4px;
        margin-bottom: 32px;
      }

      .stars-row span {
        font-size: 28px;
        animation: starPop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
      }
      .stars-row span:nth-child(1) { animation-delay: 0.1s; }
      .stars-row span:nth-child(2) { animation-delay: 0.2s; }
      .stars-row span:nth-child(3) { animation-delay: 0.3s; }
      .stars-row span:nth-child(4) { animation-delay: 0.4s; }
      .stars-row span:nth-child(5) { animation-delay: 0.5s; }

      @keyframes starPop {
        from { opacity: 0; transform: scale(0.4) rotate(-15deg); }
        to   { opacity: 1; transform: scale(1) rotate(0deg); }
      }

      /* CTA Button */
      .btn-review {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 16px 24px;
        background: #1a73e8;
        color: #fff;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        border: none;
        border-radius: 14px;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 8px 24px -6px rgba(26, 115, 232, 0.5);
        transition: transform 0.15s ease, box-shadow 0.2s ease;
        margin-bottom: 12px;
      }

      .btn-review:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px -6px rgba(26, 115, 232, 0.65);
      }

      .btn-review:active { transform: translateY(0); }

      .btn-review .g-badge {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .btn-review .g-badge svg {
        width: 18px;
        height: 18px;
      }

      /* Countdown hint */
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 32px;
      }

      .hint #countdown {
        font-weight: 700;
        color: var(--primary-light);
      }

      /* Divider */
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e2e8f0;
      }
      .divider span {
        font-size: 11px;
        color: #cbd5e1;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      /* Keluhan link */
      .btn-complaint {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
        text-decoration: underline;
        text-decoration-color: transparent;
        transition: color 0.15s, text-decoration-color 0.15s;
      }

      .btn-complaint:hover {
        color: var(--primary);
        text-decoration-color: var(--primary);
      }

      /* Keluhan Panel */
      .complaint-panel {
        display: none;
        margin-top: 24px;
        text-align: left;
        animation: up 0.3s ease both;
      }

      .complaint-panel.show { display: block; }

      .complaint-panel label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
      }

      .complaint-panel textarea {
        width: 100%;
        min-height: 110px;
        padding: 12px 14px;
        font-family: inherit;
        font-size: 14px;
        color: var(--text);
        background: #fff;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        resize: vertical;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        margin-bottom: 10px;
      }

      .complaint-panel textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
      }

      .btn-send {
        width: 100%;
        padding: 13px;
        background: var(--primary);
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.15s, transform 0.15s;
      }

      .btn-send:hover { background: #4338ca; transform: translateY(-1px); }
      .btn-send:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

      .err-msg {
        display: none;
        margin-top: 8px;
        font-size: 12px;
        color: #e11d48;
        text-align: center;
      }
      .err-msg.show { display: block; }

      /* Footer */
      .footer {
        margin-top: 36px;
        font-size: 11px;
        color: #cbd5e1;
        letter-spacing: 0.3px;
      }
      .footer b { color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Google icon -->
      <div class="g-icon">
        <!-- Official Google "G" SVG -->
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
      </div>

      <!-- Business info -->
      <div class="biz-name" id="biz-name">Memuat...</div>
      <div class="biz-addr" id="biz-addr"></div>

      <!-- Decorative stars -->
      <div class="stars-row">
        <span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span>
      </div>

      <!-- CTA button -->
      <a id="btn-review" href="#" target="_blank" rel="noopener noreferrer" class="btn-review">
        <span class="g-badge">
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
          </svg>
        </span>
        Tulis Ulasan di Google Maps
      </a>

      <!-- Auto redirect hint -->
      <p class="hint">Otomatis membuka dalam <span id="countdown">3</span> detik...</p>

      <!-- Complaint section -->
      <div class="divider"><span>atau</span></div>

      <button type="button" class="btn-complaint" id="btn-open-complaint">
        😕 Pengalaman kurang memuaskan?
      </button>

      <div class="complaint-panel" id="complaint-panel">
        <label for="complaint-text">Ceritakan apa yang bisa kami perbaiki:</label>
        <textarea id="complaint-text" maxlength="1000" placeholder="Tulis masukan atau keluhan Anda di sini..."></textarea>
        <button type="button" class="btn-send" id="btn-send">Kirim ke Pemilik Usaha</button>
        <p class="err-msg" id="err-msg"></p>
      </div>

      <div class="footer">Didukung oleh <b>ReviewKita</b></div>
    </div>

    <script>
      (async () => {
        const cardCode = window.location.pathname.split('/').pop();
        let reviewUrl = '#';

        // Load business info
        try {
          const res = await fetch(`/api/cards/${cardCode}/info`);
          const data = await res.json();
          if (data.success) {
            document.getElementById('biz-name').textContent = data.business_name;
            document.getElementById('biz-addr').textContent = data.address;
            document.title = `Ulasan Google – ${data.business_name}`;
            reviewUrl = data.review_url;
            document.getElementById('btn-review').href = reviewUrl;
          } else {
            document.getElementById('biz-name').textContent = 'Bisnis';
            document.getElementById('biz-addr').textContent = 'Informasi tidak tersedia';
          }
        } catch (e) {
          document.getElementById('biz-name').textContent = 'Bisnis';
          document.getElementById('biz-addr').textContent = 'Gagal memuat data';
        }

        // Record scan event & auto-redirect countdown
        fetch(`/api/cards/${cardCode}/rate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating: 5 })
        }).catch(() => {});

        let secs = 3;
        const cdEl = document.getElementById('countdown');
        const timer = setInterval(() => {
          secs--;
          cdEl.textContent = secs;
          if (secs <= 0) {
            clearInterval(timer);
            if (reviewUrl && reviewUrl !== '#') {
              window.location.href = reviewUrl;
            }
          }
        }, 1000);

        // Stop countdown when user manually clicks button
        document.getElementById('btn-review').addEventListener('click', () => {
          clearInterval(timer);
          document.querySelector('.hint').style.display = 'none';
        });

        // Complaint toggle
        document.getElementById('btn-open-complaint').addEventListener('click', () => {
          clearInterval(timer);
          document.querySelector('.hint').textContent = '';
          const panel = document.getElementById('complaint-panel');
          panel.classList.toggle('show');
        });

        // Send complaint to WhatsApp
        document.getElementById('btn-send').addEventListener('click', async () => {
          const text = document.getElementById('complaint-text').value.trim();
          const errEl = document.getElementById('err-msg');
          errEl.classList.remove('show');

          if (!text) {
            errEl.textContent = 'Keluhan wajib diisi sebelum dikirim.';
            errEl.classList.add('show');
            return;
          }

          const btn = document.getElementById('btn-send');
          btn.disabled = true;
          btn.textContent = 'Mengirim...';

          try {
            const r = await fetch(`/api/cards/${cardCode}/feedback`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ rating: 1, complaint: text }),
            });
            const d = await r.json();
            if (d.success) {
              window.location.href = d.wa_url;
            } else {
              errEl.textContent = d.message || 'Gagal mengirim.';
              errEl.classList.add('show');
              btn.disabled = false;
              btn.textContent = 'Kirim ke Pemilik Usaha';
            }
          } catch {
            errEl.textContent = 'Gagal mengirim. Coba lagi.';
            errEl.classList.add('show');
            btn.disabled = false;
            btn.textContent = 'Kirim ke Pemilik Usaha';
          }
        });
      })();
    </script>
  </body>
</html>
