<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beri Review - ReviewKita</title>
    <meta name="description" content="Berikan ulasan dan rating bintang 5 untuk bisnis ini di Google Maps." />
    <link rel="stylesheet" href="/style.css" />
    <style>
      /* ============================
         Review Page Styles
         ============================ */
      body {
        background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 50%, #004d40 100%);
      }

      .container {
        max-width: 400px;
        padding: 0;
        overflow: hidden;
      }

      .review-header {
        background: linear-gradient(135deg, #1a73e8, #0d47a1);
        padding: 28px 24px 32px;
        position: relative;
        overflow: hidden;
      }

      .review-header::before {
        content: '';
        position: absolute;
        top: -40%;
        right: -20%;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
      }
      .review-header::after {
        content: '';
        position: absolute;
        bottom: -50%;
        left: -15%;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: rgba(255,255,255,0.04);
      }

      .review-header .google-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        padding: 6px 14px;
        border-radius: var(--radius-full);
        font-size: 12px;
        font-weight: 600;
        color: white;
        margin-bottom: 16px;
      }

      .review-header h2 {
        color: white;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 6px;
        position: relative;
        z-index: 1;
        -webkit-text-fill-color: white;
      }

      .review-header .biz-address {
        color: rgba(255,255,255,0.7);
        font-size: 13px;
        position: relative;
        z-index: 1;
      }

      .review-body {
        padding: 28px 24px 32px;
      }

      .stars-display {
        display: flex;
        justify-content: center;
        gap: 4px;
        margin-bottom: 20px;
      }
      .stars-display .star {
        font-size: 36px;
        animation: star-pop 0.3s ease both;
        cursor: default;
        filter: drop-shadow(0 2px 4px rgba(251, 191, 36, 0.3));
      }
      .star:nth-child(1) { animation-delay: 0.1s; }
      .star:nth-child(2) { animation-delay: 0.2s; }
      .star:nth-child(3) { animation-delay: 0.3s; }
      .star:nth-child(4) { animation-delay: 0.4s; }
      .star:nth-child(5) { animation-delay: 0.5s; }
      @keyframes star-pop {
        from { opacity: 0; transform: scale(0.5) rotate(-15deg); }
        to { opacity: 1; transform: scale(1) rotate(0deg); }
      }

      .review-prompt {
        font-size: 16px;
        color: var(--neutral-700);
        font-weight: 500;
        margin-bottom: 8px;
      }

      .review-subtext {
        font-size: 13px;
        color: var(--neutral-400);
        margin-bottom: 24px;
        line-height: 1.5;
      }

      .btn-google-review {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 16px 24px;
        background: linear-gradient(135deg, #4285f4, #1a73e8);
        color: white;
        text-decoration: none;
        font-size: 16px;
        font-weight: 700;
        border-radius: var(--radius-sm);
        box-shadow: 0 4px 16px rgba(66, 133, 244, 0.35);
        transition: all var(--transition-base);
        letter-spacing: 0.3px;
      }
      .btn-google-review:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(66, 133, 244, 0.45);
      }
      .btn-google-review:active {
        transform: translateY(0);
      }
      .btn-google-review .g-icon {
        width: 22px;
        height: 22px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 800;
        color: #4285f4;
        flex-shrink: 0;
      }

      .powered-by {
        margin-top: 20px;
        font-size: 11px;
        color: var(--neutral-400);
        text-align: center;
      }
      .powered-by a {
        color: var(--primary-500);
        text-decoration: none;
        font-weight: 600;
      }

      /* NFC tap ripple animation */
      .tap-animation {
        width: 80px;
        height: 80px;
        margin: 0 auto 16px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tap-animation .phone-icon {
        font-size: 36px;
        position: relative;
        z-index: 2;
        animation: float-up 3s ease-in-out infinite;
      }
      @keyframes float-up {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .tap-animation .ripple {
        position: absolute;
        width: 60px;
        height: 60px;
        border: 2px solid rgba(26, 115, 232, 0.2);
        border-radius: 50%;
        animation: ripple-out 2s ease-out infinite;
      }
      .tap-animation .ripple:nth-child(2) { animation-delay: 0.6s; }
      .tap-animation .ripple:nth-child(3) { animation-delay: 1.2s; }
      @keyframes ripple-out {
        from { width: 30px; height: 30px; opacity: 1; }
        to { width: 100px; height: 100px; opacity: 0; }
      }

      /* Loading skeleton */
      .skeleton {
        background: linear-gradient(90deg, var(--neutral-100) 25%, var(--neutral-50) 50%, var(--neutral-100) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 4px;
      }
      @keyframes shimmer {
        from { background-position: 200% 0; }
        to { background-position: -200% 0; }
      }
      .skeleton-text {
        height: 20px;
        width: 60%;
        margin: 0 auto 8px;
      }
      .skeleton-text-sm {
        height: 14px;
        width: 80%;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <main class="container" id="review-card">
      <!-- Header with business info -->
      <div class="review-header" id="review-header">
        <div class="google-badge">
          <span>G</span> Google Reviews
        </div>
        <h2 id="biz-name">
          <div class="skeleton skeleton-text"></div>
        </h2>
        <div class="biz-address" id="biz-address">
          <div class="skeleton skeleton-text-sm"></div>
        </div>
      </div>

      <!-- Body -->
      <div class="review-body">
        <!-- NFC Tap animation -->
        <div class="tap-animation">
          <div class="ripple"></div>
          <div class="ripple"></div>
          <div class="ripple"></div>
          <span class="phone-icon">📱</span>
        </div>

        <!-- Stars -->
        <div class="stars-display">
          <span class="star">⭐</span>
          <span class="star">⭐</span>
          <span class="star">⭐</span>
          <span class="star">⭐</span>
          <span class="star">⭐</span>
        </div>

        <p class="review-prompt">Bagaimana pengalaman Anda?</p>
        <p class="review-subtext">
          Bantu bisnis ini berkembang dengan memberikan ulasan jujur Anda di Google Maps.
        </p>

        <a
          href="#"
          id="btn-review"
          class="btn-google-review"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="g-icon">G</span>
          BERI RATING DI GOOGLE
        </a>

        <div class="powered-by">
          Powered by <a href="#">ReviewKita</a>
        </div>
      </div>
    </main>

    <script>
      (async () => {
        const pathParts = window.location.pathname.split('/');
        const cardCode = pathParts[pathParts.length - 1];

        try {
          const res = await fetch(`/api/cards/${cardCode}/info`);
          const data = await res.json();

          if (data.success) {
            document.getElementById('biz-name').textContent = data.business_name;
            document.getElementById('biz-address').textContent = data.address;
            document.getElementById('btn-review').href = data.review_url;

            document.title = `Beri Review - ${data.business_name} | ReviewKita`;
          } else {
            document.getElementById('biz-name').textContent = 'Bisnis';
            document.getElementById('biz-address').textContent = 'Informasi tidak tersedia';
          }
        } catch (e) {
          document.getElementById('biz-name').textContent = 'Bisnis';
          document.getElementById('biz-address').textContent = 'Gagal memuat data';
        }
      })();
    </script>
  </body>
</html>
