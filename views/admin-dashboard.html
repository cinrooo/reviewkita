<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin - ReviewKita</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .dashboard-container {
        max-width: 960px;
        margin: 30px auto;
        background: white;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: left;
      }
      .header-dash {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #eee;
        padding-bottom: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .header-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .stats-row {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .stat-card {
        flex: 1;
        min-width: 120px;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        color: white;
        font-weight: bold;
      }
      .stat-card .number {
        font-size: 28px;
        display: block;
      }
      .stat-card .label {
        font-size: 12px;
        opacity: 0.9;
      }
      .stat-total { background: #1a73e8; }
      .stat-ready { background: #f0ad4e; }
      .stat-active { background: #28a745; }
      .search-bar {
        margin-bottom: 15px;
      }
      .search-bar input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        padding: 10px 12px;
        border: 1px solid #ddd;
        text-align: left;
        font-size: 14px;
      }
      th {
        background-color: #f4f4f4;
        position: sticky;
        top: 0;
      }
      .status-ready {
        background: #ffeeba;
        color: #856404;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
      }
      .status-active {
        background: #d4edda;
        color: #155724;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
      }
      .btn-logout {
        background: #dc3545;
        color: white;
        padding: 8px 15px;
        text-decoration: none;
        border-radius: 4px;
        font-size: 13px;
        border: none;
        cursor: pointer;
      }
      .btn-export {
        background: #28a745;
        color: white;
        padding: 8px 15px;
        text-decoration: none;
        border-radius: 4px;
        font-size: 13px;
        border: none;
        cursor: pointer;
      }
      .btn-export:hover { background: #218838; }
      .btn-delete {
        background: #dc3545;
        color: white;
        border: none;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      .btn-delete:hover { background: #c82333; }
      @media (max-width: 600px) {
        .dashboard-container { margin: 10px; padding: 15px; }
        th, td { padding: 6px 8px; font-size: 12px; }
      }
    </style>
  </head>
  <body style="display:block; padding: 0;">
    <div class="dashboard-container">
      <div class="header-dash">
        <h2 style="margin:0;">Dashboard Admin</h2>
        <div class="header-actions">
          <a href="/api/admin/export-csv" class="btn-export">📥 Ekspor CSV</a>
          <a href="/admin/logout" class="btn-logout">Logout</a>
        </div>
      </div>

      <!-- Statistik -->
      <div class="stats-row">
        <div class="stat-card stat-total">
          <span class="number" id="stat-total">-</span>
          <span class="label">Total Kartu</span>
        </div>
        <div class="stat-card stat-ready">
          <span class="number" id="stat-ready">-</span>
          <span class="label">Belum Aktif</span>
        </div>
        <div class="stat-card stat-active">
          <span class="number" id="stat-active">-</span>
          <span class="label">Sudah Aktif</span>
        </div>
      </div>

      <!-- Search -->
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="🔍 Cari kode kartu atau nama bisnis..." />
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Kode Kartu</th>
            <th>Status</th>
            <th>Bisnis Terhubung</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr>
            <td colspan="5" style="text-align: center">Memuat data...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      let allCards = [];

      // Ambil statistik
      async function fetchStats() {
        try {
          const res = await fetch("/api/admin/stats");
          const stats = await res.json();
          document.getElementById("stat-total").textContent = stats.total;
          document.getElementById("stat-ready").textContent = stats.ready;
          document.getElementById("stat-active").textContent = stats.active;
        } catch (e) {
          console.error("Gagal memuat statistik", e);
        }
      }

      // Ambil data kartu
      async function fetchCards() {
        try {
          const response = await fetch("/api/admin/cards");
          allCards = await response.json();
          renderCards(allCards);
        } catch (error) {
          console.error("Gagal memuat data", error);
          document.getElementById("table-body").innerHTML =
            '<tr><td colspan="5" style="text-align: center">Gagal memuat data. Coba login ulang.</td></tr>';
        }
      }

      function renderCards(cards) {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";

        if (!Array.isArray(cards) || cards.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="5" style="text-align: center">Belum ada kartu di database. Jalankan: node database/generator.js</td></tr>';
          return;
        }

        cards.forEach((card) => {
          const tr = document.createElement("tr");

          let statusBadge = "";
          if (card.status === "READY")
            statusBadge = '<span class="status-ready">READY</span>';
          else if (card.status === "ACTIVE")
            statusBadge = '<span class="status-active">ACTIVE</span>';
          else statusBadge = `<span>${card.status}</span>`;

          tr.innerHTML = `
            <td>${card.id}</td>
            <td><strong>${card.card_code}</strong></td>
            <td>${statusBadge}</td>
            <td>${card.business_name ? card.business_name : "<em>- Belum Aktif -</em>"}</td>
            <td><button class="btn-delete" onclick="deleteCard(${card.id}, '${card.card_code}')">Hapus</button></td>
          `;
          tbody.appendChild(tr);
        });
      }

      // Hapus kartu
      async function deleteCard(id, code) {
        if (!confirm(`Yakin ingin menghapus kartu ${code}?`)) return;

        try {
          const res = await fetch(`/api/admin/cards/${id}`, { method: "DELETE" });
          const data = await res.json();
          if (data.success) {
            alert("Kartu berhasil dihapus!");
            fetchCards();
            fetchStats();
          } else {
            alert("Gagal: " + data.message);
          }
        } catch (e) {
          alert("Terjadi kesalahan saat menghapus.");
        }
      }

      // Filter/cari
      document.getElementById("search-input").addEventListener("input", function () {
        const q = this.value.toLowerCase();
        const filtered = allCards.filter(
          (c) =>
            c.card_code.toLowerCase().includes(q) ||
            (c.business_name && c.business_name.toLowerCase().includes(q))
        );
        renderCards(filtered);
      });

      // Load data
      fetchStats();
      fetchCards();
    </script>
  </body>
</html>
