<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Login - ReviewKita</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .login-box {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .form-group {
        margin-bottom: 15px;
        text-align: left;
      }
      .form-input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="login-box">
        <h2>Login Admin</h2>
        <!-- Perhatikan: Form ini dikirim ke /admin/login dengan metode POST -->
        <form action="/admin/login" method="POST">
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-input" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              name="password"
              class="form-input"
              required
            />
          </div>
          <button
            type="submit"
            class="btn"
            style="width: 100%; margin-top: 10px"
          >
            LOGIN
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
